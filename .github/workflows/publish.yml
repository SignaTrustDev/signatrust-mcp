name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm 11.5.1 or later; Node 20 ships npm 10.
      - run: npm install -g npm@^11.5.1

      # Same install as ci.yml: `npm ci` hits the rollup optional-deps bug there.
      - run: rm -f package-lock.json && npm install

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
